[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "arx-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned arx Harness runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/centurionarx/arx-harness"
Documentation = "https://github.com/centurionarx/arx-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/centurionarx/arx-harness/issues"
Source = "https://github.com/centurionarx/arx-harness"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/arx_harness_runtime/runtime/arx-jsonrpc-agent-*"]
exclude = ["src/arx_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/arx_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
