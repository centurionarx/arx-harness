# Bundled default config. The runtime still requires an explicit
# $ARX_CORDIS_CONFIG or argv path; the SDK injects this path for bundled
# zero-config launches. SDK-set session-root and cwd variables have manual-run fallbacks.

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: sdk-jsonrpc-server
  name: '@arx-ai/arx-sdk-jsonrpc-server'

# Agent spine; the SDK server creates agents per sessionId.
- id: agent-core
  name: '@arx-ai/arx-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# The OpenAI-compatible adapter, serving the one route the Python SDK's own
# defaults name. Endpoint and credential come from the launching environment,
# so this file still holds no secret and names no vendor; a deployment that
# wants a different route supplies its own $ARX_CORDIS_CONFIG. `?? ''` turns an
# unset endpoint into a load-time refusal rather than a request that goes
# nowhere. The declared route inherits no catalog, so it spells out its models,
# its effort ladder, and the endpoint's own output-cap field.
- id: llm-pi-ai
  name: '@arx-ai/arx-llm-pi-ai'
  config:
    providers:
      primary:
        displayName: Primary
        apiKeyEnv: PRIMARY_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.PRIMARY_BASE_URL ?? ''"
        compat:
          maxTokensField: max_tokens
        # Quoted because YAML 1.1 reads a bare `off` as a boolean.
        models:
          - id: primary-pro
            reasoningEfforts: &efforts
              'off':
              'low': low
              'medium': medium
              'high': high
          - id: primary-flash
            reasoningEfforts: *efforts

# JSONL persistence; $ARX_SESSION_ROOT wins over ./.sessions in the process cwd.
- id: sessions
  name: '@arx-ai/arx-session-persistence-jsonl'
  config:
    root: !!js process.env.ARX_SESSION_ROOT ?? './.sessions'

# Persistence owns durable storage; this separate policy explicitly selects
# the request, tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@arx-ai/arx-session-checkpoint-policy'

# Local bash executor; $ARX_CWD wins over the process cwd.
# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@arx-ai/arx-subprocess-local'

- id: bash
  name: '@arx-ai/arx-bash-local'
  config:
    cwd: !!js process.env.ARX_CWD ?? process.cwd()

# Local filesystem provider for workspace instruction loading. This does not
# expose model-facing file tools by itself.
- id: fs-local
  name: '@arx-ai/arx-fs-local'
  config:
    cwd: !!js process.env.ARX_CWD ?? process.cwd()
