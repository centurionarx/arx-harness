# Keyless both mode combines the runtime/registry patch with the Primary-to-replay
# swap. Include patches cannot target entries behind a nested include, so this file
# applies both overlays directly to `cordis.yml`.
- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm
        name: '@arx-ai/arx-llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@arx-ai/arx-acp-demo'
        config:
          provider: primary
          model: primary-flash
          persistenceRoot: !!js process.env.ARX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@arx-ai/arx-code-runtime-worker-thread'
          - id: llm-replay
            name: '@arx-ai/arx-llm-replay'
            config:
              providers:
                - id: primary
                  name: Primary
                  models:
                    - id: primary-flash
                    - id: primary-pro
