# Keyless filesystem snapshots apply the spill and replay overlays directly
# because include patches cannot target entries behind a nested include. The
# sandboxed filesystem stack already lives in the base cordis.yml. This file also
# re-pins the acp-agent model to `primary-flash`: `cordis.yml` ships
# `primary-pro`, but the recorded corpus was captured on flash, and a config
# patch replaces the whole app config, so the base fields are restated verbatim.
- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm
        name: '@arx-ai/arx-llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@arx-ai/arx-acp-demo'
        config:
          provider: primary
          model: primary-flash
          persistenceRoot: !!js process.env.ARX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: spill-local
            name: '@arx-ai/arx-spill-local'
            config:
              root: !!js process.env.ARX_SNAPSHOT_SPILL_ROOT ?? './.spill'
          - id: spill-policy
            name: '@arx-ai/arx-spill-policy'
            config:
              maxInlineBytes: 800
          - id: llm-replay
            name: '@arx-ai/arx-llm-replay'
            config:
              providers:
                - id: primary
                  name: Primary
                  models:
                    - id: primary-flash
                    - id: primary-pro
