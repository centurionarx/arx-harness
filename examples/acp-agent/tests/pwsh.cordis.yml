# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm
  name: '@arx-ai/arx-llm-pi-ai'
  config:
    providers:
      # pi-ai ships no `primary` catalog route, so this profile
      # declares the whole provider instead of narrowing an inherited one.
      primary:
        displayName: Primary
        apiKeyEnv: PRIMARY_API_KEY
        api: openai-completions
        baseURL: https://api.example-provider.test
        defaultContextWindow: 1000000
        defaultMaxTokens: 256000
        models:
          - id: primary-pro

- id: subprocess
  name: '@arx-ai/arx-subprocess-local'

- id: bash
  name: '@arx-ai/arx-pwsh-local'

- id: shell-env
  name: '@arx-ai/arx-shell-env'

- id: acp-agent
  name: '@arx-ai/arx-acp-demo'
  config:
    provider: primary
    model: primary-pro
    persistenceRoot: !!js process.env.ARX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.ARX_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@arx-ai/arx-tool-pwsh'
