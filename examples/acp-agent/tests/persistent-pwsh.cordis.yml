# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm
  name: '@arx-ai/arx-llm-pi-ai'
  config:
    providers:
      # pi-ai ships no `deepseek-official` catalog route, so this profile
      # declares the whole provider instead of narrowing an inherited one.
      deepseek-official:
        displayName: DeepSeek
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: https://api.deepseek.com
        defaultContextWindow: 1000000
        defaultMaxTokens: 256000
        models:
          - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@arx-ai/arx-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@arx-ai/arx-subprocess-local'

- id: terminal
  name: '@arx-ai/arx-terminal'

- id: terminal-pwsh
  name: '@arx-ai/arx-terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@arx-ai/arx-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.ARX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.ARX_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@arx-ai/arx-tool-pwsh-persistent'
