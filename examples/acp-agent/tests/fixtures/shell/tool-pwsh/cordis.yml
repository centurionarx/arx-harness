# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@centurionarx/cxh-system-prompt'

- id: tools
  name: '@centurionarx/cxh-tools'

- id: subprocess
  name: '@centurionarx/cxh-subprocess-local'

- id: bash
  name: '@centurionarx/cxh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@centurionarx/cxh-shell-env'

- id: tasks
  name: '@centurionarx/cxh-jobs-local'

- id: tool-jobs
  name: '@centurionarx/cxh-tool-jobs'

- id: tool-pwsh
  name: '@centurionarx/cxh-tool-pwsh'
