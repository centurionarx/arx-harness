# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm
  name: '@arx-ai/arx-llm-pi-ai'
  config:
    providers:
      # pi-ai ships no `deepseek-official` catalog route, so this profile
      # declares the whole provider instead of narrowing an inherited one.
      deepseek-official:
        displayName: DeepSeek
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: https://api.deepseek.com
        defaultContextWindow: 1000000
        defaultMaxTokens: 256000
        models:
          - id: deepseek-v4-pro

- id: subprocess
  name: '@arx-ai/arx-subprocess-local'

- id: bash
  name: '@arx-ai/arx-bash-local'

- id: acp-agent
  name: '@arx-ai/arx-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.ARX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.ARX_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-fs-search
  name: '@arx-ai/arx-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4
