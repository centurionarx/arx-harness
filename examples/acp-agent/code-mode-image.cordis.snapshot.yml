# Keyless replay combines Code Mode with the durable image store and an exact
# image-capable replay route. The scenario generates its tiny PNG inside the
# run_code program, then exercises read_image as a nested dispatch.
- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm
        name: '@arx-ai/arx-llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@arx-ai/arx-acp-demo'
        config:
          provider: primary
          model: primary-flash-vision
          persistenceRoot: !!js process.env.ARX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: code
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@arx-ai/arx-attachment-local'
          - id: code-runtime
            name: '@arx-ai/arx-code-runtime-worker-thread'
          - id: llm-replay
            name: '@arx-ai/arx-llm-replay'
            config:
              providers:
                - id: primary
                  name: Primary
                  models:
                    - id: primary-flash
                      inputModalities: [text]
                    - id: primary-pro
                      inputModalities: [text]
                    - id: primary-flash-vision
                      inputModalities: [text, image]
