# Keyless dynamic-configuration composition: the base settings and credentials
# providers see only the isolated run home, no API key exists anywhere, and
# the primary route still registers — so the prompt fails with the actionable
# MISSING_CREDENTIAL guidance this snapshot pins as first-run UX.
- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm
        name: '@arx-ai/arx-llm-pi-ai'
        disabled: true
      - insert:
          # The endpoint is never dialed: credential resolution fails first.
          - id: llm-keyless
            name: '@arx-ai/arx-llm-pi-ai'
            config:
              providers:
                primary:
                  displayName: Primary
                  apiKeyEnv: PRIMARY_API_KEY
                  api: openai-completions
                  baseURL: 'http://127.0.0.1:9'
                  defaultContextWindow: 1000000
                  defaultMaxTokens: 256000
                  reasoning: high
                  models:
                    - id: primary-flash
                      reasoningEfforts:
                        off:
                        high: high
