# Keyless opt-in PTY composition for the headless stream-json snapshot.
- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm
        name: '@arx-ai/arx-llm-pi-ai'
        disabled: true
      - insert:
          - id: sandbox-policy
            name: '@arx-ai/arx-sandbox-policy'
            config:
              mode: danger-full-access
          - id: pty
            name: '@arx-ai/arx-terminal'
          - id: pty-snapshot-backend
            name: '../acp-agent/pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@arx-ai/arx-tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@arx-ai/arx-llm-replay'
