# Keyless context-overflow composition for the assembled compaction snapshot.
- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm
        name: '@arx-ai/arx-llm-pi-ai'
        disabled: true
      - id: compaction-basic
        name: '@arx-ai/arx-compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 32
      - insert:
          - id: llm-replay
            name: '@arx-ai/arx-llm-replay'
            config:
              providers:
                - id: primary
                  models:
                    - id: primary-flash
                      contextWindow: 128000
