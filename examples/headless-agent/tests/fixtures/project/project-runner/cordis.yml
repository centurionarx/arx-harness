# Real saved-workflow services; the test driver replaces only the model adapter.
- name: '@arx-ai/arx-llm'
- name: '@arx-ai/arx-session'
- name: '@arx-ai/arx-system-prompt'
- name: '@arx-ai/arx-tools'
- name: '@arx-ai/arx-agent'
- name: '@arx-ai/arx-storage'
- name: '@arx-ai/arx-storage-json'
  config:
    root: './.storages'
- name: '@arx-ai/arx-storage-domain'
  config:
    backend: json
- name: '@arx-ai/arx-workspace'
- name: '@arx-ai/arx-project'
- name: '@arx-ai/arx-tool-project'
- name: '@arx-ai/arx-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none
- name: '@arx-ai/arx-subagent'
- name: '@arx-ai/arx-subagent-spawn-in-process'
- name: '@arx-ai/arx-project-runner'
- name: '@arx-ai/arx-agent-loop'
  config:
    agents:
      - id: main
        provider: project-fixture
        model: test
        cwd: !!js process.cwd()
