- id: cli-mock-llm
  name: './cli-mock-llm.ts'

- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm
        name: '@arx-ai/arx-llm-pi-ai'
        disabled: true
      - id: agent-spine
        name: '@arx-ai/arx-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          arxHome: './.arx-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@arx-ai/arx-session-persistence-jsonl'
        config:
          root: './.sessions'
