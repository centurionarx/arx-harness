- id: base
  name: '@arx-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      # A patch replaces the row's whole config, so the route is restated in
      # full with this scenario's mock endpoint and its pinned defaults.
      - id: llm
        config:
          providers:
            primary:
              displayName: Primary
              apiKeyEnv: PRIMARY_API_KEY
              api: openai-completions
              baseURL: !!js process.env.ARX_SNAPSHOT_BASE_URL
              compat:
                maxTokensField: max_tokens
              reasoning: low
              # Above the mock's keep-alive cadence: the SSE comment frames it
              # sends between chunks do not reset this adapter's idle timer.
              streamIdleTimeoutMs: 5000
              models:
                - id: primary-flash
                  contextWindow: 1000000
                  maxTokens: 256000
                  reasoningEfforts:
                    off:
                    low: low
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: primary
              model: primary-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless Primary adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
