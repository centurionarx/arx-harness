# The headless one-shot agent reaching its model through a subscription
# CLI instead of an HTTP provider. Everything else — tools, sandbox, session
# log, compaction — is the base composition unchanged, which is the point:
# only the transport to the model differs.
#
# Requires the vendor CLI to be logged in on this host (`claude login`). There
# is no credential entry below because this harness never handles one.

# User-settings document (`$ARX_HOME/settings.yaml`, hot-reloaded): a
# `llm-agent-cli:` section there overlays the adapter entry below without a
# restart. The entry is that section's base, so a route added from settings
# joins the one pinned here rather than displacing it.
- id: settings
  name: '@arx-ai/arx-settings-file'

# A subscription-authenticated vendor CLI as an ordinary model route. No API
# key is involved: the CLI reads the login the host already has, and the
# subprocess service below owns the process tree it spawns. `contextWindow` is
# required because automatic compaction resolves capacity from this route and
# the CLI discloses none.
- id: llm-agent-cli
  name: '@arx-ai/arx-llm-agent-cli'
  config:
    providers:
      claude-subscription:
        displayName: Claude (subscription)
        models:
          - id: claude-sonnet-4-5
            contextWindow: 200000
            maxTokens: 8192
            acceptsImages: true

# Skills. The registry is the seam; the filesystem provider supplies the
# catalog from the shared agent roots, including `~/.agents/skills`, which is
# where a tool-neutral skill catalog installs. The model reaches a skill by
# calling the `skill` tool, so loading one is a logged tool call rather than
# ambient prompt text - which is also why this route refuses the vendor CLI's
# own Skill tool.
- id: skill
  name: '@arx-ai/arx-skill'

- id: skill-filesystem
  name: '@arx-ai/arx-skill-filesystem'

- id: tool-skill
  name: '@arx-ai/arx-tool-skill'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@arx-ai/arx-subprocess-local'

- id: bash
  name: '@arx-ai/arx-bash-local'
  config:
    timeoutMs: 60000

# The example composition pre-creates one fresh `main` agent for its test driver.
- id: agent-spine
  name: '@arx-ai/arx-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: claude-subscription
        model: claude-sonnet-4-5
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are headless-agent, a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: persistence
  name: '@arx-ai/arx-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.ARX_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@arx-ai/arx-session-checkpoint-policy'

# Summarize an older range when derived history approaches the context window.
- id: token-meter
  name: '@arx-ai/arx-token-meter'

- id: compaction-basic
  name: '@arx-ai/arx-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Projection registry: durable subagent identity (mode/label) folds through
# its registered units; subagent catalog reads fail loud without the capability.
- id: session-projection
  name: '@arx-ai/arx-session-projection'

# Expose fresh-child `spawn` and completed-prefix `fork` through independent
# in-process backends.
- id: subagent
  name: '@arx-ai/arx-subagent'

- id: subagent-spawn-in-process
  name: '@arx-ai/arx-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@arx-ai/arx-subagent-fork-in-process'
  config:
    providerName: fork

# Continuable background children are selected per delegation tool. The
# separately loaded control registers global `send_message`; `report` is
# installed only in continuable child scopes.
- id: tool-subagent-control
  name: '@arx-ai/arx-tool-subagent-control'

- id: tool-subagent-report
  name: '@arx-ai/arx-tool-subagent-report'

- id: tool-subagent
  name: '@arx-ai/arx-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

# Fork stays one-shot because a continuable child's `report` tool and prompt
# section precede the inherited history a fork reuses; `run_in_background` is off
# as an explicit foreground-only choice even though agent-spine-demo mounts the
# generic Job runtime. See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
- id: tool-subagent-fork
  name: '@arx-ai/arx-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# The worker-thread workflow engine fans a model-written JavaScript script's
# `agent()` calls out through the spawn backend.
- id: workflow-worker-thread
  name: '@arx-ai/arx-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@arx-ai/arx-tool-workflow'

# A separate fixed consumer demonstrates fresh-agent Ralph iteration without
# changing the workflow tool or same-session goal behavior.
- id: tool-ralph
  name: '@arx-ai/arx-tool-ralph'

# `todo_write` replaces the logged whole list.
- id: tool-todo
  name: '@arx-ai/arx-tool-todo'
  config:
    allowParallelInProgress: true

# Policy loads before the model-facing filesystem tools so writes and edits
# require an observed file. Relative paths resolve from the process cwd.
- id: fs-local
  name: '@arx-ai/arx-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@arx-ai/arx-fs-observation-policy'

- id: tool-fs
  name: '@arx-ai/arx-tool-fs'
