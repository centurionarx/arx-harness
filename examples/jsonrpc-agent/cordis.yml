# Unattended coding-agent deployment for the bundled arx-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@arx-ai/arx-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.ARX_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.ARX_MAX_TOKENS_AS_SUCCESS)"

# The OpenAI-compatible adapter. Shipped default: full thinking at max effort
# on every request; exact-model resolution materializes request defaults before
# logging. The model arrives per session over JSON-RPC, so the route lists the
# ids it serves rather than pinning one.
- id: llm
  name: '@arx-ai/arx-llm-pi-ai'
  config:
    providers:
      # The installed catalog describes no `primary` route, so this profile
      # declares the whole provider — endpoint and models included — instead of
      # narrowing an inherited one. `?? ''` turns an unset endpoint into a
      # load-time refusal rather than a request that goes nowhere.
      primary:
        displayName: Primary
        apiKeyEnv: PRIMARY_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.PRIMARY_BASE_URL ?? ''"
        defaultContextWindow: 1000000
        defaultMaxTokens: 256000
        reasoning: high
        # A declared route inherits no vendor dialect, so the endpoint's own
        # spelling of the output cap is named here. `openai-completions`
        # otherwise sends `max_completion_tokens`, which reasoning-era OpenAI
        # reads and a plain chat-completions host ignores.
        compat:
          maxTokensField: max_tokens
        # A hand-declared model inherits no catalog capability, so the route's
        # `reasoning` level is only servable where the model spells the effort
        # ladder out. The keys are quoted because YAML 1.1 reads a bare `off`
        # as a boolean.
        models:
          - id: primary-pro
            reasoningEfforts: &efforts
              'off':
              'low': low
              'medium': medium
              'high': high
          - id: primary-flash
            reasoningEfforts: *efforts

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@arx-ai/arx-subprocess-local'

- id: bash
  name: '@arx-ai/arx-bash-local'
  config:
    cwd: !!js process.env.ARX_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@arx-ai/arx-agent-spine-demo'
  config:
    persona: !!js process.env.ARX_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@arx-ai/arx-session-persistence-jsonl'
  config:
    root: !!js process.env.ARX_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.ARX_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@arx-ai/arx-session-checkpoint-policy'

- id: subagent
  name: '@arx-ai/arx-subagent'

- id: subagent-spawn-in-process
  name: '@arx-ai/arx-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@arx-ai/arx-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@arx-ai/arx-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@arx-ai/arx-fs-local'
  config:
    cwd: !!js process.env.ARX_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@arx-ai/arx-fs-observation-policy'

- id: tool-fs
  name: '@arx-ai/arx-tool-fs'

- id: token-meter
  name: '@arx-ai/arx-token-meter'

- id: compaction-basic
  name: '@arx-ai/arx-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
