# Complete unattended minimal-agent composition for the Python SDK. The model
# sees one deployment-selected system prompt and only the owner-scoped
# persistent Bash and string-replace editor tools. Runtime-context injection and
# context compaction are absent.

- id: sdk-jsonrpc-server
  name: '@arx-ai/arx-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm
  name: '@arx-ai/arx-llm-pi-ai'
  config:
    providers:
      # The installed catalog describes no `primary` route, so this profile
      # declares the whole provider — endpoint and models included — instead of
      # narrowing an inherited one. The endpoint is a reserved-TLD placeholder
      # that never resolves: shipped composition outranks the shell, so a
      # deployment replaces it here or through a patch overlay, and an
      # unreplaced one fails visibly instead of dialling somebody's host.
      primary:
        displayName: Primary
        apiKeyEnv: PRIMARY_API_KEY
        api: openai-completions
        baseURL: https://api.example-provider.test
        defaultContextWindow: 1000000
        defaultMaxTokens: 256000
        # A declared route inherits no vendor dialect, so the endpoint's own
        # spelling of the output cap is named here. `openai-completions`
        # otherwise sends `max_completion_tokens`, which reasoning-era OpenAI
        # reads and a plain chat-completions host ignores.
        compat:
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.ARX_MODEL ?? 'primary-flash'

- id: sandbox
  name: '@arx-ai/arx-sandbox-local'

- id: sandbox-policy
  name: '@arx-ai/arx-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.ARX_CWD ?? process.cwd()

- id: subprocess
  name: '@arx-ai/arx-subprocess-local'

- id: pty
  name: '@arx-ai/arx-terminal'

- id: terminal-bash
  name: '@arx-ai/arx-terminal-bash'
  config:
    timeoutMs: 300000

# The editor uses the bare local filesystem; persistent Bash still consumes the
# shared danger-full-access sandbox policy above.
- id: fs-local
  name: '@arx-ai/arx-fs-local'
  config:
    cwd: !!js process.env.ARX_CWD ?? process.cwd()

- id: agent-spine
  name: '@arx-ai/arx-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.ARX_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: persistent-bash
  name: '@arx-ai/arx-tool-bash-persistent'
  config:
    timeoutMs: 300000
    description: |-
      Run commands in a bash shell
      * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
      * You don't have access to the internet via this tool.
      * You do have access to a mirror of common linux and python packages via apt and pip.
      * State is persistent across command calls and discussions with the user.
      * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
      * Please avoid commands that may produce a very large amount of output.
      * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

- id: str-replace-editor
  name: '@arx-ai/arx-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: sessions
  name: '@arx-ai/arx-session-persistence-jsonl'
  config:
    root: !!js process.env.ARX_SESSION_ROOT ?? './.sessions'
    compression: none
