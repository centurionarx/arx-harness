<svg xmlns="http://www.w3.org/2000/svg" width="100" height="76" viewBox="0 0 100 76">
	<style>
		.a { fill: #22a6f2; }
		.rx, .plateLabel { fill: #0b4c9e; }
		.plate { fill: none; stroke: #0b4c9e; stroke-width: 1.5; }
		.dark { display: none; }
		@media (prefers-color-scheme: dark) {
			.light { display: none; }
			.dark { display: inline; }
			.rx, .plateLabel { fill: #8ed4ff; }
			.plate { stroke: #8ed4ff; }
		}
		/* The full brand seat: the eye raster spans the full canvas width (was
		   92% with dead vertical space), and the wordmark scales to the same
		   width beneath it, same ink pair as the app. */
	</style>
	<image class="light" href="data:image/png;base64," x="0" y="0" width="100" height="53.75"/>
	<image class="dark" href="data:image/png;base64," x="0" y="0" width="100" height="53.75"/>
	<g transform="translate(0 56.5) scale(0.5556)">
		<text x="0" y="31" textLength="80" lengthAdjust="spacingAndGlyphs" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-2"><tspan class="a">a</tspan><tspan class="rx">rx</tspan></text>
		<rect class="plate" x="95" y="7" width="84" height="20" rx="3"/>
		<text class="plateLabel" x="105" y="21.5" textLength="64" lengthAdjust="spacingAndGlyphs" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">HARNESS</text>
	</g>
</svg>
