name: CI master

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: Manual CI suite to run
        required: true
        default: larger-runner-benchmark
        type: choice
        options:
          - larger-runner-benchmark
          - consolidated-runner-benchmark
          - macos-lifecycle-diagnosis
          - macos-lifecycle-acceptance

# A master push may carry only the two self-hosted standby drills and the Wine
# apt cache seeder; those drills outlast the interval between master merges, so
# push is exempt from cancellation (see ci-failover-runbook). workflow_dispatch
# keeps cancelling: a re-dispatched runner benchmark holds up to 12 larger
# runners for 15 minutes in this same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  ARX_TELEMETRY_DISABLED: '1'

jobs:
  # Master seeds the Wine apt-archive cache in the default-branch scope,
  # which every pull request's windows job can restore; saves from
  # pull-request runs are scoped to their own merge ref and help nobody
  # else. Runs in seconds when the image version already has a cache.
  wine-apt-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: wine apt cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compose Wine apt cache key
        id: wine-cache-key
        run: echo "key=wine-debs-${ImageOS:-linux}-${ImageVersion:-v0}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: wine-cache
        with:
          path: ~/wine-debs
          key: ${{ steps.wine-cache-key.outputs.key }}

      - name: Download the Wine dependency closure
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only wine
          mkdir -p "$HOME/wine-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/wine-debs/"
          du -sh "$HOME/wine-debs"

  # Hot-standby drill for the in-house self-hosted pool: every master move
  # re-runs the complete unsharded aggregate on the persistent 64-core VM,
  # continuously proving that environment can take over a required lane if
  # the hosted pools degrade (the switch is then setting the writer-manageable
  # ARX_CI_FAILOVER_LINUX variable — see the failover runbook, no merge required).
  # Push-triggered, so this lane always executes the base branch's own
  # workflow definition. This workflow never listens to pull_request, so the
  # drill does not appear in PR checks. No cache steps because the VM's
  # persistent pnpm store and tool caches make them redundant (and saving here
  # would poison the hosted cache namespace with self-hosted paths).
  serial-linux-selfhosted:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: serial / linux (self-hosted standby)
    runs-on: [self-hosted, linux, x64, vm-backup]
    steps:
      # ARX_ARCHIVE_BASE_REF below compares the frozen-archive gate against
      # github.event.before, so full history is required: depth 2 would miss it
      # on multi-commit or force pushes; full fetch is cheap here because
      # checkout resolves against the VM's local mirror.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent pnpm store
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The persistent VM image owns Playwright's Linux system packages; this
      # step also proves that browser provisioning remains usable for failover.
      - name: Install Playwright Chromium
        run: pnpm --filter @arx-ai/arx-web-frontend exec playwright install chromium

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run complete unsharded primary Node CI serially
        env:
          ARX_ARCHIVE_BASE_REF: ${{ github.event.before }}
          ARX_COVERAGE_MAX_WORKERS: '1'
          ARX_E2E_MAX_WORKERS: '1'
          ARX_GATE_CONCURRENCY: '1'
          ARX_OXLINT_THREADS: '1'
          ARX_PUBLINT_CONCURRENCY: '1'
          ARX_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci:linux-primary

  # TODO(hosted-serial-ci): Re-enable the one remaining disabled hosted serial
  # reference job (serial-macos) before release. Re-enabling serial-macos does
  # not restore a Linux hosted-cache producer: decide whether to add a master
  # seeder or remove the restore-only steps if cold starts become a concern.
  serial-macos:
    if: false
    name: serial / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI serially
        env:
          ARX_COVERAGE_MAX_WORKERS: '1'
          ARX_E2E_MAX_WORKERS: '1'
          ARX_GATE_CONCURRENCY: '1'
          ARX_PUBLINT_CONCURRENCY: '1'
          ARX_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci

  # Hot-standby drill for the in-house self-hosted Windows pool: every master
  # move re-runs the complete unsharded Windows gate inventory on the persistent
  # VM, continuously proving that environment can take over the required
  # `windows` lane if the hosted pool degrades (the switch is setting the
  # writer-manageable ARX_CI_FAILOVER_WINDOWS variable — see the failover
  # runbook, no merge required). Push-triggered, so this lane always executes
  # the base branch's own workflow definition. This workflow never listens to
  # pull_request, so the drill does not appear in PR checks. No cache steps
  # because the VM's persistent pnpm store and tool caches make them redundant
  # (and saving here would poison the hosted cache namespace with self-hosted
  # paths).
  serial-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: serial / windows (self-hosted standby)
    runs-on: [self-hosted, arx-win-ci, windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent pnpm store
        shell: pwsh
        run: |
          $storeRoot = "$env:LOCALAPPDATA\pnpm\store"
          echo "PNPM_CONFIG_STORE_DIR=$storeRoot" >> $env:GITHUB_ENV

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded Windows gate inventory serially
        shell: pwsh
        env:
          ARX_COVERAGE_MAX_WORKERS: '1'
          ARX_GATE_CONCURRENCY: '1'
          ARX_PUBLINT_CONCURRENCY: '1'
        run: pnpm run check:ci:windows-complete

  # Manual, bounded comparison of the actual critical Linux and Windows lanes.
  # The named pools are restricted at the organization level to this repository.
  larger-runner-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'larger-runner-benchmark'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - platform: linux
            cores: '4'
            runner: arx-ubuntu-24-04-4core
            workload: typecheck
          - platform: linux
            cores: '8'
            runner: arx-ubuntu-24-04-8core
            workload: typecheck
          - platform: linux
            cores: '16'
            runner: arx-ubuntu-24-04-16core
            workload: typecheck
          - platform: linux
            cores: '32'
            runner: arx-ubuntu-24-04-32core
            workload: typecheck
          - platform: linux
            cores: '64'
            runner: arx-ubuntu-24-04-64core
            workload: typecheck
          - platform: linux
            cores: '96'
            runner: arx-ubuntu-24-04-96core
            workload: typecheck
          - platform: windows
            cores: '4'
            runner: arx-windows-2025-4core
            workload: production-site
          - platform: windows
            cores: '8'
            runner: arx-windows-2025-8core
            workload: production-site
          - platform: windows
            cores: '16'
            runner: arx-windows-2025-16core
            workload: production-site
          - platform: windows
            cores: '32'
            runner: arx-windows-2025-32core
            workload: production-site
          - platform: windows
            cores: '64'
            runner: arx-windows-2025-64core
            workload: production-site
          - platform: windows
            cores: '96'
            runner: arx-windows-2025-96core
            workload: production-site
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # The benchmark's Windows lanes deliberately skip the store cache like
      # the independent native Windows job; an empty input disables caching.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: ${{ matrix.platform == 'linux' && 'pnpm' || '' }}

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run critical Linux typecheck lane
        if: matrix.platform == 'linux'
        run: pnpm run typecheck

      - name: Run critical Windows production-site lane
        if: matrix.platform == 'windows'
        run: pnpm run docs:build

  # Manual comparison of the intended low-fanout topology. Linux runs the
  # complete unsharded primary aggregate with bounded in-runner parallelism;
  # Windows runs both blocking build targets concurrently through run-gates.
  consolidated-runner-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'consolidated-runner-benchmark'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - platform: linux
            cores: '4'
            runner: arx-ubuntu-24-04-4core
            workers: '4'
          - platform: linux
            cores: '8'
            runner: arx-ubuntu-24-04-8core
            workers: '8'
          - platform: linux
            cores: '16'
            runner: arx-ubuntu-24-04-16core
            workers: '16'
          - platform: linux
            cores: '32'
            runner: arx-ubuntu-24-04-32core
            workers: '32'
          - platform: linux
            cores: '64'
            runner: arx-ubuntu-24-04-64core
            workers: '32'
          - platform: linux
            cores: '96'
            runner: arx-ubuntu-24-04-96core
            workers: '32'
          - platform: windows
            cores: '4'
            runner: arx-windows-2025-4core
            workers: '2'
          - platform: windows
            cores: '8'
            runner: arx-windows-2025-8core
            workers: '2'
          - platform: windows
            cores: '16'
            runner: arx-windows-2025-16core
            workers: '2'
          - platform: windows
            cores: '32'
            runner: arx-windows-2025-32core
            workers: '2'
          - platform: windows
            cores: '64'
            runner: arx-windows-2025-64core
            workers: '2'
          - platform: windows
            cores: '96'
            runner: arx-windows-2025-96core
            workers: '2'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # Unlike the larger-runner suite, both platforms cache the store here:
      # the consolidated topology measures cache mechanics as workload.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      - name: Install and prepare Linux
        if: matrix.platform == 'linux'
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Install (immutable)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI concurrently
        if: matrix.platform == 'linux'
        env:
          ARX_COVERAGE_MAX_WORKERS: ${{ matrix.workers }}
          ARX_GATE_CONCURRENCY: ${{ matrix.workers }}
          ARX_OXLINT_THREADS: ${{ matrix.workers }}
          ARX_PUBLINT_CONCURRENCY: ${{ matrix.workers }}
          ARX_SNAPSHOT_MAX_CONCURRENCY: ${{ matrix.workers }}
        run: pnpm run check:ci

      - name: Run blocking Windows builds concurrently
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ARX_GATE_CONCURRENCY: ${{ matrix.workers }}
        run: pnpm run check:ci:windows-blocking

  macos-lifecycle-diagnosis:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'macos-lifecycle-diagnosis'
    name: macos / bounded lifecycle diagnosis
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Record platform and source identity
        run: |
          node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch}))'
          git rev-parse HEAD HEAD^{tree}
          shasum -a 256 pnpm-lock.yaml vendor/hmr/src/index.ts
      - name: Owning tests before instrumentation
        continue-on-error: true
        run: pnpm exec vitest run packages/boot/app-boot/tests/hmr-config.spec.ts packages/git/repository/tests/repository.spec.ts
      - name: Install bounded observation-only trace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vendor/hmr/src/index.ts')
          original = p.read_text()
          anchor = '    const registration = { watcher }'
          assert original.count(anchor) == 1
          trace = """    let diagnosticCount = 0
              const trace = (stage: string, details: object = {}) => {
                if (diagnosticCount++ < 100) console.log('HMR_DIAG ' + JSON.stringify({ stage, at: Date.now(), filename, watchFilename, root, depth, ...details }))
              }
              trace('registered', { polling: watcher.options.usePolling })
              watcher.on('raw', (event, path, details) => trace('raw', { event, path, details }))
              watcher.on('all', (event, path) => trace('all', { event, path, watched: watcher.getWatched() }))
              watcher.on('error', (error) => trace('error', { message: String(error) }))
              watcher.once('ready', () => trace('ready', { watched: watcher.getWatched() }))
              """
          original_onchange = "      const observed = resolve(path)\n      if (observed !== filename && observed !== watchFilename) return"
          traced_onchange = "      const observed = resolve(path)\n      trace('filter', { observed, accepted: observed === filename || observed === watchFilename })\n      if (observed !== filename && observed !== watchFilename) return"
          assert original.count(original_onchange) == 1
          updated = original.replace(anchor, trace + anchor).replace(original_onchange, traced_onchange)
          updated = updated.replace('this.refreshConfig(registration, filename, refresh)', "this.refreshConfig(registration, filename, async () => { trace('refresh-start'); try { await refresh(); trace('refresh-end') } catch (error) { trace('refresh-failure', { message: String(error) }); throw error } })")
          p.write_text(updated)
          PY
      - name: Three fixed native-watcher measurements
        run: |
          set +e
          failures=0
          for round in 1 2 3; do
            echo "HMR_DIAG_ROUND=$round"
            pnpm exec vitest run packages/boot/app-boot/tests/hmr-config.spec.ts -t 'config parent did not exist'
            status=$?
            echo "HMR_DIAG_EXIT=$status"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "HMR_DIAG_FAILURES=$failures/3"
          [ "$failures" -eq 0 ]

  macos-lifecycle-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'macos-lifecycle-acceptance'
    name: macos / complete unit and Seatbelt acceptance
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Record platform and source identity
        run: |
          node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch}))'
          git rev-parse HEAD HEAD^{tree}
          shasum -a 256 pnpm-lock.yaml vendor/hmr/src/index.ts
      - name: Unit tests (darwin parity)
        run: pnpm run test
      - name: Sandbox e2e (real kernel confinement, world-verified)
        env:
          NO_COLOR: 1
        run: |
          set -u +e -o pipefail
          out=$(pnpm exec vitest run --config vitest.e2e.config.ts \
            packages/sandbox/sandbox-local/tests/seatbelt.e2e.ts \
            packages/shell/bash-sandbox/tests/seatbelt.e2e.ts 2>&1); status=$?
          echo "$out"
          [ "$status" -eq 0 ]
          echo "$out" | grep -qE 'Test Files[[:space:]]+2 passed \(2\)'
